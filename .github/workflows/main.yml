name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: bundle exec standardrb --no-fix

  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        cc: [gcc, clang]
        include:
          # Ruby built with AddressSanitizer, x86-64 only: memory errors in the
          # C code fail the specs. ubsan adds UndefinedBehaviorSanitizer.
          - ruby: asan-release
            os: ubuntu-24.04
            cc: clang
            ubsan: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install Clang
        if: matrix.cc == 'clang'
        run: command -v clang || { sudo apt-get update && sudo apt-get install -y clang; }

      - name: Compile
        env:
          # Same warnings for both compilers; Ruby's defaults are GCC-only.
          MAKEFLAGS: >-
            CC=${{ matrix.cc }}${{ matrix.ubsan && '\ -fsanitize=undefined\ -fno-sanitize-recover=all' || '' }}
            warnflags=-Wall\ -Wextra\ -Wno-unused-parameter\ -Werror
        run: bundle exec rake compile

      - name: Install Intel SDE if the CPU lacks AVX512
        if: runner.arch == 'X64'
        run: .github/install-sde

      - name: Show codecs
        run: $SDE bundle exec ruby -Ilib -rob64 -e 'p Ob64.codecs, Ob64.codec'

      - name: Test
        env:
          # Fails the codec spec if one is missing
          OB64_CODECS: ${{ runner.arch == 'X64' && 'scalar,avx2,avx512' || 'scalar,neon64' }}
        run: $SDE bundle exec rake spec

  codecs:
    # The C codecs alone under ASan and UBSan, on exact-size buffers.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    # Long under SDE, which emulates AVX512 slowly
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install Clang
        if: matrix.cc == 'clang'
        run: command -v clang || { sudo apt-get update && sudo apt-get install -y clang; }

      - name: Install Intel SDE if the CPU lacks AVX512
        if: runner.arch == 'X64'
        run: .github/install-sde

      - name: Test
        env:
          CC: ${{ matrix.cc }}
          OB64_CODECS: ${{ runner.arch == 'X64' && 'scalar,avx2,avx512' || 'scalar,neon64' }}
        run: bundle exec rake spec:c

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"

      - name: Build gem
        run: gem build ob64.gemspec

      - name: Install gem
        run: gem install --local ./ob64-*.gem

      - name: Smoke test
        working-directory: ${{ runner.temp }}
        run: |
          ruby -e '
            require "ob64"
            require "ob64/core_ext"
            s = Random.bytes(4096)
            abort "RFC 4648 round trip failed" unless Ob64::Base64::RFC4648.decode(Ob64::Base64::RFC4648.encode(s)) == s
            abort "RFC 2045 round trip failed" unless Ob64::Base64::RFC2045.decode(Ob64::Base64::RFC2045.encode(s)) == s
            abort "UU round trip failed" unless Ob64::UU.decode(Ob64::UU.encode(s)) == s
            abort "pack round trip failed" unless [s].pack("m0").unpack1("m0") == s
          '
